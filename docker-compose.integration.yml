services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memory}
      POSTGRES_USER: ${POSTGRES_USER:-memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memory} -d ${POSTGRES_DB:-memory}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - memory_net

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--help"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - memory_net

  memory-api:
    build:
      context: .
      dockerfile: memory_api/Dockerfile
      target: runtime
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memory}
      POSTGRES_USER: ${POSTGRES_USER:-memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memory}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      MEMORY_API_HOST: ${MEMORY_API_HOST:-0.0.0.0}
      MEMORY_API_PORT: ${MEMORY_API_PORT:-8000}
      MEMORY_API_LOG_LEVEL: ${MEMORY_API_LOG_LEVEL:-info}
      MEMORY_QDRANT_COLLECTION: ${MEMORY_QDRANT_COLLECTION:-memories_integration}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic-local}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-32}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - memory_net

  test-runner:
    build:
      context: .
      dockerfile: memory_api/Dockerfile
      target: test-runner
    environment:
      MEMORY_API_BASE_URL: http://memory-api:8000
    depends_on:
      memory-api:
        condition: service_healthy
    networks:
      - memory_net

volumes:
  postgres_data:
  qdrant_data:

networks:
  memory_net:
    driver: bridge
